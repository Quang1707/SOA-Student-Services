server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: profile-service-route
              uri: lb://profile-service
              predicates:
                - Path=/api/v1/profiles,/api/v1/profiles/**,/api/profiles,/api/profiles/**,/api/v1/auth,/api/v1/auth/**,/api/auth,/api/auth/**
            - id: document-service-route
              uri: lb://document-service
              predicates:
                - Path=/api/v1/documents,/api/v1/documents/**,/api/documents,/api/documents/**
            - id: audit-notification-route
              uri: lb://audit-notification-service
              predicates:
                - Path=/api/v1/audits,/api/v1/audits/**,/api/audits,/api/audits/**
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

spring.application.name=document-service
server.port=${SERVER_PORT:8082}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DOCUMENT_DB_NAME:document_db}}
spring.datasource.username=${DOCUMENT_DB_USER:document_app}
spring.datasource.password=${DOCUMENT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# Flyway manages schema; Hibernate validates it at startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT and service-to-service authentication (must match Profile Service).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:student-profile-auth-service}
app.internal.service-key=${INTERNAL_SERVICE_KEY:}

# The document service uses Eureka + Spring Cloud LoadBalancer to reach Profile Service.
profile.service.url=${PROFILE_SERVICE_URL:http://profile-service/api/v1/profiles}
profile.service.instance-info-url=${PROFILE_SERVICE_INSTANCE_INFO_URL:http://profile-service/api/v1/instance-info}

# RabbitMQ: documents and profiles publish events into the queue consumed by Audit Service.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:student_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
audit.rabbitmq.exchange=${AUDIT_RABBITMQ_EXCHANGE:audit_exchange}
audit.rabbitmq.routing-key=${AUDIT_RABBITMQ_ROUTING_KEY:audit_routing_key}

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Rút ngắn thời gian làm mới danh sách instance cho bài kiểm thử TH7.
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
